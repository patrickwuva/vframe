<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>vframe</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="backdrop"></div>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Raspberry Pi Display Controller</p>
        <h1>vframe</h1>
        <p class="subtle" id="status-line">Connecting...</p>
      </div>
      <div class="pill-row">
        <span class="pill" id="wifi-pill">LAN only</span>
        <span class="pill" id="player-pill">Player idle</span>
      </div>
    </header>

    <section class="grid">
      <div class="card">
        <div class="card-head">
          <h2>Library & Upload</h2>
          <p class="subtle">Add files or folders. Then build albums.</p>
        </div>
        <div class="upload">
          <label class="upload-box">
            <input type="file" id="file-upload" multiple />
            <span>Drop files or click to upload</span>
          </label>
          <label class="upload-box alt">
            <input type="file" id="folder-upload" webkitdirectory directory multiple />
            <span>Upload a folder</span>
          </label>
          <div class="upload-actions">
            <button class="btn" id="upload-btn">Upload</button>
            <span class="subtle" id="upload-status"></span>
          </div>
        </div>

        <div class="filters">
          <button class="chip active" data-filter="all">All</button>
          <button class="chip" data-filter="image">Images</button>
          <button class="chip" data-filter="video">Videos</button>
          <button class="chip" data-filter="folder">Folders</button>
        </div>

        <div class="library" id="library-list"></div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Albums & Playback</h2>
          <p class="subtle">Pick what plays and control the screen.</p>
        </div>

        <div class="album-create">
          <input type="text" id="album-name" placeholder="New album name" />
          <button class="btn" id="create-album">Create</button>
        </div>

        <div class="album-grid" id="album-grid"></div>

        <div class="panel">
          <h3>Album Editor</h3>
          <div class="row">
            <select id="album-select"></select>
            <button class="btn ghost" id="add-selected">Add selected</button>
            <button class="btn ghost" id="replace-selected">Replace with selected</button>
          </div>
          <div class="row">
            <label>
              <span>Shuffle</span>
              <select id="album-shuffle">
                <option value="default">Use global</option>
                <option value="true">Shuffle on</option>
                <option value="false">Shuffle off</option>
              </select>
            </label>
            <button class="btn ghost" id="save-album-settings">Save album settings</button>
          </div>
          <div class="album-sources" id="album-sources"></div>
        </div>

        <div class="panel">
          <h3>Playback</h3>
          <div class="row wrap">
            <button class="btn" id="play-album">Play</button>
            <button class="btn ghost" id="stop-playback">Stop</button>
            <button class="btn ghost" id="prev-item">Prev</button>
            <button class="btn ghost" id="next-item">Next</button>
            <button class="btn ghost" id="toggle-mute">Mute</button>
          </div>
          <div class="now-playing" id="now-playing"></div>
        </div>

        <div class="panel">
          <h3>Settings</h3>
          <div class="settings-grid">
            <label>
              <span>Slide duration (sec)</span>
              <input type="number" min="2" step="0.5" id="slide-duration" />
            </label>
            <label>
              <span>Transition</span>
              <select id="transition">
                <option value="none">None</option>
                <option value="fade">Fade</option>
              </select>
            </label>
            <label>
              <span>Fade duration (sec)</span>
              <input type="number" min="0" step="0.1" id="fade-duration" />
            </label>
            <label>
              <span>Fit mode</span>
              <select id="fit-mode">
                <option value="fit-blur">Fit + blur</option>
                <option value="fit">Fit + bars</option>
                <option value="fill">Fill + crop</option>
              </select>
            </label>
            <label>
              <span>Display width</span>
              <input type="number" min="100" step="1" id="display-width" />
            </label>
            <label>
              <span>Display height</span>
              <input type="number" min="100" step="1" id="display-height" />
            </label>
            <label class="toggle">
              <input type="checkbox" id="shuffle" />
              <span>Shuffle by default</span>
            </label>
            <label>
              <span>Primary media path</span>
              <input type="text" id="primary-root" placeholder="/srv/vframe-media" />
            </label>
            <label>
              <span>Secondary media path</span>
              <input type="text" id="secondary-root" placeholder="/mnt/vframe-media" />
            </label>
            <label>
              <span>Overflow threshold (GB)</span>
              <input type="number" min="1" step="1" id="overflow-threshold" />
            </label>
            <label class="toggle">
              <input type="checkbox" id="mute" />
              <span>Mute audio</span>
            </label>
          </div>
          <div class="row">
            <button class="btn" id="save-settings">Save settings</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
