<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Digital Frame Player</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="player-page" data-status-url="{{ status_url }}">
<div id="player-root" class="player-root">
    <img id="player-image" class="player-media hidden" alt="frame image">
    <video id="player-video" class="player-media hidden" autoplay muted playsinline></video>
    <div id="player-overlay" class="player-overlay">Waiting for an active album...</div>
</div>
<script src="{{ url_for('static', filename='js/player.js') }}"></script>
</body>
</html>
