<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Frame Admin{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<header class="topbar">
    <div class="wrap">
        <a class="brand" href="{{ url_for('admin.dashboard') }}">Pi Frame</a>
        <nav>
            <a href="{{ url_for('admin.dashboard') }}">Dashboard</a>
            <a href="{{ url_for('admin.upload') }}">Upload</a>
            <a href="{{ url_for('admin.library') }}">Library</a>
            <a href="{{ url_for('admin.albums') }}">Albums</a>
            <a href="{{ url_for('player.player_view') }}" target="_blank" rel="noopener">Player</a>
        </nav>
    </div>
</header>

<main class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <ul class="flash-list">
        {% for category, message in messages %}
        <li class="flash {{ category }}">{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</main>
</body>
</html>
