{% extends "base.html" %}
{% block title %}Albums{% endblock %}
{% block content %}
<section class="grid two">
    <article class="card">
        <h1>Create Album</h1>
        <form method="post">
            <label for="name">Name</label>
            <input id="name" name="name" required>
            <button type="submit">Create</button>
        </form>
    </article>

    <article class="card">
        <h1>Albums</h1>
        <ul class="simple-list">
            {% for album in albums %}
            <li>
                <div>
                    <strong>{{ album.name }}</strong>
                    <span class="muted">{{ album.item_count }} items</span>
                </div>
                <a class="button-link" href="{{ url_for('admin.edit_album', album_id=album.id) }}">Edit</a>
            </li>
            {% else %}
            <li>No albums yet</li>
            {% endfor %}
        </ul>
    </article>
</section>
{% endblock %}
